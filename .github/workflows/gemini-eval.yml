name: Gemini eval
on:
  push:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button
    inputs:
      model:
        description: "Gemini model ID (blank = default in run_eval.py)"
        required: false
  schedule:
    - cron: "0 0 * * *"     # optional: daily at midnight UTC

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    environment: SIMPLE     # GEMINI_API_KEY is an environment secret of SIMPLE
    timeout-minutes: 10
    outputs:
      published: ${{ steps.upload.outcome == 'success' }}
    defaults:
      run:
        working-directory: gemini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-genai
      - run: HISTORY_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/history.json" python evals/run_eval.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
      # Runs with API errors still write a report so outages show up in the trend.
      - id: upload
        if: ${{ !cancelled() && hashFiles('gemini/site/index.html') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: gemini/site

  deploy:
    needs: eval
    if: ${{ !cancelled() && needs.eval.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
